<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Doors - Floor Tier List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1>Doors Floor Tier List</h1>
        <nav class="nav-buttons">
            <button onclick="showPage('home')">Home</button>
            <button onclick="showPage('floors')">Tier List</button>
        </nav>
    </header>

    <main id="home-view" class="view-container">
        <div class="home-hero">
            <h2>Welcome to the Ultimate Doors Rankings</h2>
            <p>Explore the hardest modes, floors, and legacy areas from Roblox Doors. Click the button below to dive straight into the tier list!</p>
            <button class="cta-button" onclick="showPage('floors')">View Tier List</button>
        </div>
    </main>

    <main id="floors-view" class="view-container" style="display: none;">
        <div class="tier-list-header">
            <h2>All Floors Ranked</h2>
            <p>From the brutal depths of Super Hard Mode to forgotten archives.</p>
        </div>
        <div id="floors-container" class="floors-grid">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
