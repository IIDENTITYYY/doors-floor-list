<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOORS Floor Tier List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="home-view" class="home-container">
        <h1>DOORS FLOOR TIER LIST</h1>
        <div class="button-group">
            <button class="main-btn" onclick="showPage('floors')">Go to Main List</button>
            <button class="main-btn" onclick="showPage('chases')">Chases List</button>
            <button class="main-btn" onclick="showPage('bossfights')">Bossfights List</button>
        </div>
        <div class="update-log-container">
            <h2>UPDATE LOG</h2>
            <ul>
                <li>Reworked The Entire Site</li>
                <li>2 New Lists : Chases and Bossfights</li>
                <li>Added Animations (kind of..?)</li>
                <li>Made it smoother</li>
                <li>Optimized lol</li>
                <li>And More..!</li>
            </ul>
        </div>
    </div>

    <div id="floors-view" class="view-container" style="display: none;">
        <button class="back-btn" onclick="showPage('home')">Back to Home</button>
        <div class="list-header"><h1>Floors Tier List</h1></div>
        <div class="grid-container" id="floors-container"></div>
    </div>

    <div id="chases-view" class="view-container" style="display: none;">
        <button class="back-btn" onclick="showPage('home')">Back to Home</button>
        <div class="list-header"><h1>Chases Tier List</h1></div>
        <div class="grid-container" id="chases-container"></div>
    </div>

    <div id="bossfights-view" class="view-container" style="display: none;">
        <button class="back-btn" onclick="showPage('home')">Back to Home</button>
        <div class="list-header"><h1>Bossfights Tier List</h1></div>
        <div class="grid-container" id="bossfights-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
